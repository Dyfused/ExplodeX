name: Explode Build Test

on:
  push:
    branches: [ "v3" ]
  pull_request:
    branches: [ "v3" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle and Check JVM target version
      run: |
        ./gradlew build -x test 2>&1 | tee build.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        ./gradlew properties 2>&1 | grep -i "java\|jvm"
        cat build.log || echo "Build log not available"
        exit $BUILD_EXIT_CODE
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Explode
        path: |
          explode-all/build/libs/
          explode-proxy/build/libs/
          booster-plugins/maintain/build/libs/
          booster-plugins/aliyun-oss-resource/build/libs/
          booster-plugins/url-redirect-resource/build/libs/
