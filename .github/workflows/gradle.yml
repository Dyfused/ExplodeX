name: Explode Build Test

on:
  push:
    branches: [ "v3" ]
  pull_request:
    branches: [ "v3" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle
      run: ./gradlew build -x test
    - name: Verify bytecode version (JVM 17)
      run: |
        JAVA17_MAJOR=61
        FAILED=0
        for jar in explode-all/build/libs/*.jar explode-proxy/build/libs/*.jar booster-plugins/*/build/libs/*.jar; do
          [ -f "$jar" ] || continue
          echo "Checking $jar"
          FIRST_CLASS=$(unzip -Z1 "$jar" '*.class' | head -1)
          if [ -n "$FIRST_CLASS" ]; then
            TMPDIR=$(mktemp -d)
            unzip -q -p "$jar" "$FIRST_CLASS" > "$TMPDIR/check.class"
            MAJOR=$(od -An -j6 -N2 --endian=big -t u2 "$TMPDIR/check.class" | tr -d ' ')
            echo "  major version: $MAJOR"
            rm -rf "$TMPDIR"
            if [ "$MAJOR" != "$JAVA17_MAJOR" ]; then
              echo "  ERROR: expected $JAVA17_MAJOR, got $MAJOR"
              FAILED=1
            fi
          else
            echo "  WARNING: no .class files found"
          fi
        done
        if [ "$FAILED" -ne 0 ]; then
          echo "Bytecode version check failed!"
          exit 1
        fi
        echo "All checked JARs are JVM 17 bytecode (major version 61)."
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Explode
        path: |
          explode-all/build/libs/
          explode-proxy/build/libs/
          booster-plugins/maintain/build/libs/
          booster-plugins/aliyun-oss-resource/build/libs/
          booster-plugins/url-redirect-resource/build/libs/
